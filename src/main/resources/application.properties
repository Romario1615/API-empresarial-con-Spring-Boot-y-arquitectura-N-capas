spring.application.name=soporte-tickets
spring.datasource.url=jdbc:postgresql://localhost:5432/soporte_tickets
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.security.api-key=grupo8-soporte-2026
app.notificacion.retardo-ms=2000
app.data-loader.enabled=true
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [requestId=%X{requestId}] %-5level %logger{36} - %msg%n
logging.level.ec.edu.espe.soportetickets=INFO
