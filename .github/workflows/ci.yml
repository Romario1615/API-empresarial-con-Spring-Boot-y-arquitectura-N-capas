name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw
      - name: Compilar y ejecutar pruebas
        id: build
        run: ./mvnw -B clean verify
      - name: Resumen de pruebas
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          {
            echo "## Resultado de CI"
            if [[ "$BUILD_OUTCOME" == "success" ]]; then
              echo "**Compilación: éxito**"
            else
              echo "**Compilación: fallo** ($BUILD_OUTCOME)"
            fi
            echo ""
            echo "| Pruebas | Fallos | Errores | Omitidas |"
            echo "| ---: | ---: | ---: | ---: |"
            shopt -s nullglob
            reports=(target/surefire-reports/TEST-*.xml)
            if (( ${#reports[@]} )); then
              awk '
                /<testsuite[[:space:]]/ {
                  if (match($0, /tests="[0-9]+"/)) tests += substr($0, RSTART + 7, RLENGTH - 8)
                  if (match($0, /failures="[0-9]+"/)) failures += substr($0, RSTART + 10, RLENGTH - 11)
                  if (match($0, /errors="[0-9]+"/)) errors += substr($0, RSTART + 8, RLENGTH - 9)
                  if (match($0, /skipped="[0-9]+"/)) skipped += substr($0, RSTART + 9, RLENGTH - 10)
                }
                END { printf "| %d | %d | %d | %d |\n", tests, failures, errors, skipped }
              ' "${reports[@]}"
            else
              echo "| 0 | 0 | 0 | 0 |"
              echo ""
              echo "No se generaron informes de pruebas."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: warn

